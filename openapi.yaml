  schemas:
    HealthLive:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        timestamp: { type: string, format: date-time }
    HealthReady:
      type: object
      required: [status, timestamp, request_id]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        timestamp: { type: string, format: date-time }
        request_id: { type: string, format: uuid }
    ErrorResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        message: { type: string }
        code: { type: string }
        request_id: { type: string, format: uuid }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          nullable: true
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
            - { type: string }
            - { type: number }
            - { type: boolean }
        count: { type: integer, minimum: 0 }
    Pagination100:
      type: object
      required: [page, page_size, total, total_pages, has_next, has_previous]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
        has_next: { type: boolean }
        has_previous: { type: boolean }
    DashboardStatistics:
      type: object
      required:
        - compliant_count
        - alert_count
        - critical_count
        - non_compliant_count
        - informative_count
        - total_parameters
      properties:
        compliant_count: { type: integer, minimum: 0 }
        alert_count: { type: integer, minimum: 0 }
        critical_count: { type: integer, minimum: 0 }
        non_compliant_count: { type: integer, minimum: 0 }
        informative_count: { type: integer, minimum: 0 }
        total_parameters: { type: integer, minimum: 0 }
    DashboardResponse:
      type: object
      required: [success, data, statistics, pagination]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { type: object, additionalProperties: true }
        statistics: { $ref: '#/components/schemas/DashboardStatistics' }
        statistics_scope: { type: string, enum: [filtered_results] }
        pagination: { $ref: '#/components/schemas/Pagination100' }
        last_updated: { type: string, format: date-time }
        filters_applied: { type: object, additionalProperties: true }
        message: { type: string }
    AlertStatistics:
      type: object
      required: [total, alerta, naoConforme, critico]
      properties:
        total: { type: integer, minimum: 0 }
        alerta: { type: integer, minimum: 0 }
        naoConforme: { type: integer, minimum: 0 }
        critico: { type: integer, minimum: 0 }
    AlertResponse:
      type: object
      required: [success, data, stats, pagination]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              status:
                type: string
                enum: [ALERTA, NÃO CONFORME, CRÍTICO]
              status_code:
                type: string
                enum: [alerta, nao-conforme, critico]
        stats: { $ref: '#/components/schemas/AlertStatistics' }
        stats_scope: { type: string, enum: [filtered_results] }
        pagination: { $ref: '#/components/schemas/Pagination100' }
        filters_applied: { type: object, additionalProperties: true }
    CurrentAccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        data:
          type: object
          required:
            - cadastrado
            - perfil
            - acesso_aprovado
            - schema_ready
            - status_acesso
          properties:
            cadastrado: { type: boolean }
            perfil:
              type: string
              nullable: true
              enum: [Gestor, Analista, Usuário]
            acesso_aprovado: { type: boolean, nullable: true }
            schema_ready: { type: boolean }
            status_acesso:
              type: string
              enum: [aprovado, pendente, nao-cadastrado, migracao-pendente]
    ParameterManagementResponse:
      type: object
      required: [parametros, matrizes, legislacoes, pagination]
      properties:
        parametros:
          type: array
          items: { type: object, additionalProperties: true }
        matrizes:
          type: array
          items: { type: object, additionalProperties: true }
        legislacoes:
          type: array
          items: { type: object, additionalProperties: true }
        pagination: { $ref: '#/components/schemas/Pagination100' }
    PaginatedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { type: object, additionalProperties: true }
        count: { type: integer, minimum: 0 }
        pagination:
          type: object
          properties:
            page: { type: integer }
            page_size: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }
    MetaPaginatedResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { type: object, additionalProperties: true }
        meta:
          type: object
          required: [total, page, pageSize]
          properties:
            total: { type: integer, minimum: 0 }
            page: { type: integer, minimum: 1 }
            pageSize: { type: integer, minimum: 1, maximum: 100 }
    VerificationResponse:
      type: object
      required: [success, valid, data]
      properties:
        success: { type: boolean, enum: [true] }
        valid: { type: boolean, enum: [true] }
        data:
          type: object
          required:
            - numero
            - versao
            - emitido_em
            - conteudo_hash
            - laboratorio_nome
            - total_resultados
            - integridade_conteudo_valida
            - assinatura_valida
            - integridade_valida
          properties:
            numero: { type: string }
            versao: { type: integer, minimum: 1 }
            emitido_em: { type: string, format: date-time }
            conteudo_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
            laboratorio_nome: { type: string, nullable: true }
            total_resultados: { type: integer, minimum: 0 }
            integridade_conteudo_valida: { type: boolean }
            assinatura_valida: { type: boolean }
            integridade_valida: { type: boolean }
            assinatura:
              type: object
              nullable: true
              properties:
                id: { type: integer, format: int64 }
                acao: { type: string, enum: [REPORT_ISSUE] }
                metodo: { type: string, enum: [supabase_password] }
                assinada_em: { type: string, format: date-time }
                hash: { type: string, pattern: '^[0-9a-f]{64}$' }
                valida: { type: boolean }
    Role:
      type: string
      enum: [Gestor, Analista, Usuário]
    Prioridade:
      type: string
      enum: [normal, alta, urgente]
    PedidoStatus:
      type: string
      enum: [rascunho, recebido, em_execucao, concluido, cancelado]
    AmostraStatus:
      type: string
      enum: [recebida, em_triagem, em_analise, aguardando_revisao, concluida, rejeitada, cancelada]
    ResultadoStatus:
      type: string
      enum: [rascunho, em_revisao, aprovado, rejeitado, publicado]
    ClienteInput:
      type: object
      additionalProperties: false
      required: [codigo, nome_razao_social]
      properties:
        codigo: { type: string, minLength: 1, maxLength: 50 }
        nome_razao_social: { type: string, minLength: 1, maxLength: 200 }
        nome_fantasia: { type: string, nullable: true, maxLength: 200 }
        documento: { type: string, nullable: true, maxLength: 30 }
        email: { type: string, format: email, nullable: true }
        telefone: { type: string, nullable: true, maxLength: 40 }
        endereco: { type: string, nullable: true, maxLength: 1000 }
        observacoes: { type: string, nullable: true, maxLength: 2000 }
        ativo: { type: boolean, default: true }
    PedidoInput:
      type: object
      additionalProperties: false
      required: [codigo, cliente_id]
      properties:
        codigo: { type: string, maxLength: 50 }
        cliente_id: { type: integer, format: int64, minimum: 1 }
        solicitante: { type: string, nullable: true, maxLength: 200 }
        descricao: { type: string, nullable: true, maxLength: 2000 }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        data_entrada: { type: string, format: date-time }
        prazo: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [rascunho, recebido] }
        observacoes: { type: string, nullable: true, maxLength: 2000 }
    PedidoStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/PedidoStatus' }
        comentario: { type: string, nullable: true, maxLength: 2000 }
        motivo: { type: string, nullable: true, maxLength: 2000 }
    MetodoInput:
      type: object
      additionalProperties: false
      required: [codigo, nome, versao]
      properties:
        codigo: { type: string, maxLength: 80 }
        nome: { type: string, maxLength: 200 }
        versao: { type: string, maxLength: 50 }
        parametro_id: { type: integer, nullable: true }
        matriz_id: { type: integer, nullable: true }
        referencia_normativa: { type: string, nullable: true, maxLength: 500 }
        principio: { type: string, nullable: true, maxLength: 2000 }
        procedimento_resumido: { type: string, nullable: true, maxLength: 5000 }
        unidade_resultado: { type: string, nullable: true, maxLength: 100 }
        limite_deteccao: { type: number, minimum: 0, nullable: true }
        limite_quantificacao: { type: number, minimum: 0, nullable: true }
        incerteza_padrao: { type: number, minimum: 0, nullable: true }
        ativo: { type: boolean, default: true }
    AmostraInput:
      type: object
      additionalProperties: false
      required: [codigo_amostra, numero_da_amostra, data_coleta, matriz_id, usuario_id, parametros_ids]
      properties:
        codigo_amostra: { type: string }
        numero_da_amostra: { type: string }
        data_coleta: { type: string, format: date-time }
        localizacao: { type: string, nullable: true }
        matriz_id: { type: integer, minimum: 1 }
        usuario_id: { type: string, format: uuid }
        pedido_analise_id: { type: integer, format: int64, nullable: true }
        parametros_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        observacao_recebimento: { type: string, nullable: true, maxLength: 2000 }
    AmostraStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AmostraStatus' }
        motivo: { type: string, nullable: true, maxLength: 2000 }
        observacao: { type: string, nullable: true, maxLength: 2000 }
        local_destino: { type: string, nullable: true }
    CustodiaInput:
      type: object
      additionalProperties: false
      required: [tipo_evento]
      properties:
        tipo_evento:
          type: string
          enum: [aceite, rejeicao, movimentacao, armazenamento, retirada, descarte, status]
        status_novo: { $ref: '#/components/schemas/AmostraStatus' }
        local_origem: { type: string, nullable: true }
        local_destino: { type: string, nullable: true }
        observacao: { type: string, nullable: true, maxLength: 2000 }
        motivo: { type: string, nullable: true, maxLength: 2000 }
        ocorrido_em: { type: string, format: date-time, nullable: true }
    ResultadoInput:
      type: object
      additionalProperties: false
      required: [amostra_id, parametro_id, datacoleta, matriz_id_selecionada, legislacao_id_selecionada]
      properties:
        valor_medido: { type: number, minimum: 0, nullable: true }
        valor_qualitativo: { type: string, enum: [Ausente, Presente], nullable: true }
        amostra_id: { type: integer, minimum: 1 }
        parametro_id: { type: integer, minimum: 1 }
        metodo_analitico_id: { type: integer, format: int64, nullable: true }
        datacoleta: { type: string, format: date-time }
        matriz_id_selecionada: { type: integer, minimum: 1 }
        legislacao_id_selecionada: { type: integer, minimum: 1 }
        contexto_legislacao_id: { type: integer, nullable: true }
    CommentInput:
      type: object
      additionalProperties: false
      properties:
        comentario: { type: string, nullable: true, maxLength: 2000 }
    RequiredCommentInput:
      type: object
      additionalProperties: false
      required: [comentario]
      properties:
        comentario: { type: string, minLength: 3, maxLength: 2000 }
    SignedCommentInput:
      type: object
      additionalProperties: false
      required: [senha]
      properties:
        senha: { type: string, format: password, writeOnly: true }
        comentario: { type: string, nullable: true, maxLength: 2000 }
    SignedRequiredCommentInput:
      type: object
      additionalProperties: false
      required: [senha, comentario]
      properties:
        senha: { type: string, format: password, writeOnly: true }
        comentario: { type: string, minLength: 3, maxLength: 2000 }
    ReviewInput:
      type: object
      additionalProperties: false
      required: [decisao, senha, comentario]
      properties:
        decisao: { type: string, enum: [aprovar, rejeitar] }
        senha: { type: string, format: password, writeOnly: true }
        comentario: { type: string, nullable: true, maxLength: 2000 }
    LaudoEmissionInput:
      type: object
      additionalProperties: false
      required: [senha]
      properties:
        senha: { type: string, format: password, writeOnly: true }
        motivo:
          type: string
          nullable: true
          minLength: 3
          maxLength: 2000
          description: Obrigatório a partir da versão 2.
        motivo_revisao:
          type: string
          nullable: true
          minLength: 3
          maxLength: 2000
          deprecated: true
          description: Alias de compatibilidade.
        observacoes: { type: string, nullable: true, maxLength: 5000 }
    ArchiveInput:
      type: object
      additionalProperties: false
      properties:
        motivo: { type: string, minLength: 3, maxLength: 500 }
    RequiredReasonInput:
      type: object
      additionalProperties: false
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 3, maxLength: 1000 }
    ActiveDecisionInput:
      type: object
      additionalProperties: false
      required: [ativo, motivo]
      properties:
        ativo: { type: boolean }
        motivo: { type: string, minLength: 3, maxLength: 500 }
    InsumoInput:
      type: object
      additionalProperties: false
      required: [codigo, nome, unidade_medida]
      properties:
        codigo: { type: string, maxLength: 80 }
        nome: { type: string, maxLength: 200 }
        tipo: { type: string, enum: [REAGENTE, PADRAO, CONSUMIVEL, OUTRO], default: REAGENTE }
        unidade_medida: { type: string, maxLength: 30 }
        estoque_minimo: { type: number, minimum: 0, default: 0 }
        fabricante: { type: string, nullable: true }
        condicao_armazenamento: { type: string, nullable: true }
    InsumoUpdate:
      type: object
      additionalProperties: false
      properties:
        codigo: { type: string, maxLength: 80 }
        nome: { type: string, maxLength: 200 }
        tipo: { type: string, enum: [REAGENTE, PADRAO, CONSUMIVEL, OUTRO] }
        unidade_medida: { type: string, maxLength: 30 }
        estoque_minimo: { type: number, minimum: 0 }
        fabricante: { type: string, nullable: true }
        condicao_armazenamento: { type: string, nullable: true }
    LoteInput:
      type: object
      additionalProperties: false
      required: [numero_lote]
      properties:
        numero_lote: { type: string, maxLength: 120 }
        validade: { type: string, format: date, nullable: true }
        data_recebimento: { type: string, format: date }
        quantidade_inicial: { type: number, minimum: 0, default: 0 }
        fornecedor: { type: string, nullable: true }
        local_armazenamento: { type: string, nullable: true }
        certificado_url: { type: string, format: uri, nullable: true }
        status: { $ref: '#/components/schemas/LoteStatusEnum' }
        motivo: { type: string }
        referencia: { type: string, nullable: true }
    LoteUpdate:
      type: object
      additionalProperties: false
      properties:
        validade: { type: string, format: date, nullable: true }
        fornecedor: { type: string, nullable: true }
        local_armazenamento: { type: string, nullable: true }
        certificado_url: { type: string, format: uri, nullable: true }
    LoteStatusEnum:
      type: string
      enum: [DISPONIVEL, QUARENTENA, BLOQUEADO, ESGOTADO]
    LoteStatusInput:
      type: object
      additionalProperties: false
      required: [status, motivo]
      properties:
        status: { $ref: '#/components/schemas/LoteStatusEnum' }
        motivo: { type: string, minLength: 3, maxLength: 500 }
    StockMovementInput:
      type: object
      additionalProperties: false
      required: [tipo, quantidade, motivo]
      properties:
        tipo: { type: string, enum: [ENTRADA, SAIDA] }
        quantidade: { type: number, minimum: 0.000001 }
        motivo: { type: string, minLength: 3, maxLength: 500 }
        referencia: { type: string, nullable: true }
    StockAdjustmentInput:
      type: object
      additionalProperties: false
      required: [tipo, quantidade, motivo]
      properties:
        tipo: { type: string, enum: [AJUSTE_POSITIVO, AJUSTE_NEGATIVO] }
        quantidade: { type: number, minimum: 0.000001 }
        motivo: { type: string, minLength: 3, maxLength: 500 }
        referencia: { type: string, nullable: true }
    EquipmentInput:
      type: object
      additionalProperties: false
      required: [codigo, nome]
      properties:
        codigo: { type: string, maxLength: 80 }
        nome: { type: string, maxLength: 200 }
        fabricante: { type: string, nullable: true }
        modelo: { type: string, nullable: true }
        numero_serie: { type: string, nullable: true }
        localizacao: { type: string, nullable: true }
        criticidade: { type: string, enum: [BAIXA, MEDIA, ALTA], default: MEDIA }
        requer_calibracao: { type: boolean, default: true }
