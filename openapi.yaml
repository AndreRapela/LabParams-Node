openapi: 3.0.3
info:
  title: SYSmLab API
  version: 1.0.0
  description: |
    API REST mono-laboratório para clientes, pedidos, amostras, resultados,
    laudos verificáveis, inventário, equipamentos e QMS.
    A API apoia controles laboratoriais, mas não concede acreditação.
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - { name: Health }
  - { name: Verificação pública }
  - { name: Clientes }
  - { name: Pedidos }
  - { name: Métodos analíticos }
  - { name: Amostras }
  - { name: Resultados }
  - { name: Laudos }
  - { name: Inventário }
  - { name: Equipamentos }
  - { name: Qualidade }
  - { name: Importação }
  - { name: Catálogos }
  - { name: Monitoramento }
  - { name: Usuários }
  - { name: Auditoria }

paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Confirma que o processo está ativo
      responses:
        '200':
          description: Processo ativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLive' }

  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Confirma conectividade com o PostgreSQL
      responses:
        '200':
          description: API pronta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }
        '503':
          description: Banco indisponível.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }

  /verificar-laudo/{hash}:
    get:
      tags: [Verificação pública]
      security: []
      summary: Verifica uma versão pelo hash SHA-256
      description: |
        Não expõe cliente, identificadores da amostra ou resultados. O campo
        valid confirma que o hash foi encontrado; integridade_valida informa
        se conteúdo e assinatura também passaram pela verificação.
      parameters:
        - $ref: '#/components/parameters/ReportHash'
      responses:
        '200':
          description: Hash válido e encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /acesso-atual:
    get:
      tags: [Usuários]
      summary: Consulta o acesso da própria conta autenticada
      description: >-
        Usa exclusivamente o subject do JWT; não aceita ID de outro usuário e
        não exige perfil/aprovação prévios. Permite exibir conta pendente antes
        de navegar para áreas protegidas.
      responses:
        '200':
          description: Estado do cadastro e da aprovação da própria conta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentAccessResponse' }
        '404':
          description: JWT válido sem cadastro local correspondente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentAccessResponse' }

  /clientes:
    get:
      tags: [Clientes]
      summary: Lista clientes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
        - { in: query, name: ativo, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Page' }
    post:
      tags: [Clientes]
      summary: Cadastra cliente
      description: Requer Gestor.
      requestBody:
        $ref: '#/components/requestBodies/Cliente'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /clientes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clientes]
      summary: Consulta cliente
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clientes]
      summary: Atualiza cliente
      description: Requer Gestor.
      requestBody:
        $ref: '#/components/requestBodies/Cliente'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Clientes]
      summary: Arquiva cliente
      description: Requer Gestor.
      requestBody:
        $ref: '#/components/requestBodies/ArchiveOptional'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pedidos-analise:
    get:
      tags: [Pedidos]
      summary: Lista pedidos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
        - { in: query, name: status, schema: { $ref: '#/components/schemas/PedidoStatus' } }
        - { in: query, name: cliente_id, schema: { type: integer, format: int64 } }
        - { in: query, name: prioridade, schema: { $ref: '#/components/schemas/Prioridade' } }
      responses:
        '200': { $ref: '#/components/responses/Page' }
    post:
      tags: [Pedidos]
      summary: Abre pedido
      description: Requer Analista ou Gestor e cliente ativo.
      requestBody:
        $ref: '#/components/requestBodies/Pedido'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /pedidos-analise/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pedidos]
      summary: Consulta pedido e progresso
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pedidos]
      summary: Atualiza pedido não terminal
      description: Requer Analista ou Gestor. Cliente fica congelado após a primeira amostra.
      requestBody:
        $ref: '#/components/requestBodies/Pedido'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Pedidos]
      summary: Arquiva pedido
      description: Requer Gestor; pedido concluído é retido.
      requestBody:
        $ref: '#/components/requestBodies/ArchiveOptional'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /pedidos-analise/{id}/status:
    patch:
      tags: [Pedidos]
      summary: Executa transição de status
      description: |
        Concluir/cancelar exige Gestor. Conclusão exige todas as amostras
        concluídas; cancelamento exige ausência de amostras ativas.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/PedidoStatus'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /metodos-analiticos:
    get:
      tags: [Métodos analíticos]
      summary: Lista métodos e versões
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
        - { in: query, name: ativo, schema: { type: boolean } }
        - { in: query, name: parametro_id, schema: { type: integer } }
        - { in: query, name: matriz_id, schema: { type: integer } }
        - { in: query, name: aplicavel_parametro_id, schema: { type: integer } }
        - { in: query, name: aplicavel_matriz_id, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Page' }
    post:
      tags: [Métodos analíticos]
      summary: Cria versão de método
      description: Requer Gestor.
      requestBody:
        $ref: '#/components/requestBodies/Metodo'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Conflict' }

  /metodos-analiticos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Métodos analíticos]
      summary: Consulta método
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Métodos analíticos]
      summary: Atualiza método ainda não utilizado
      description: Requer Gestor. Método referenciado é imutável; crie nova versão.
      requestBody:
        $ref: '#/components/requestBodies/Metodo'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Métodos analíticos]
      summary: Desativa método
      description: Requer Gestor; não apaga histórico.
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /amostras:
    get:
      tags: [Amostras]
      summary: Lista amostras
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: status, schema: { $ref: '#/components/schemas/AmostraStatus' } }
        - { in: query, name: pedido_analise_id, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/Page' }
    post:
      tags: [Amostras]
      summary: Cadastra e recebe amostra
      description: Requer Analista ou Gestor; parâmetros devem pertencer à matriz.
      requestBody:
        $ref: '#/components/requestBodies/Amostra'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /amostras/matrizes:
    get:
      tags: [Amostras]
      summary: Lista matrizes para seleção
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /amostras/usuarios:
    get:
      tags: [Amostras]
      summary: Lista responsáveis para seleção
      description: Requer Analista ou Gestor.
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /amostras/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Amostras]
      summary: Consulta amostra e escopo
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Amostras]
      summary: Atualiza amostra antes do primeiro resultado
      description: Requer Analista ou Gestor.
      requestBody:
        $ref: '#/components/requestBodies/Amostra'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Amostras]
      summary: Arquiva amostra
      description: Requer Gestor e ausência de resultado ativo.
      requestBody:
        $ref: '#/components/requestBodies/ArchiveOptional'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /amostras/{id}/status:
    patch:
      tags: [Amostras]
      summary: Executa transição de status
      description: |
        Estado terminal exige Gestor. Conclusão exige correspondência exata
        entre parâmetros esperados e resultados publicados.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/AmostraStatus'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /amostras/{id}/custodia:
    get:
      tags: [Amostras]
      summary: Consulta cadeia de custódia append-only
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Page' }
    post:
      tags: [Amostras]
      summary: Registra evento de custódia
      description: Rejeição exige Gestor; recebimento é automático.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/Custodia'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Conflict' }

  /resultados-analise:
    get:
      tags: [Resultados]
      summary: Lista resultados ativos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: status, schema: { $ref: '#/components/schemas/ResultadoStatus' } }
        - { in: query, name: amostra_id, schema: { type: integer } }
        - { in: query, name: parametro_id, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Page' }
    post:
      tags: [Resultados]
      summary: Registra resultado como rascunho
      description: Requer Analista ou Gestor; valida escopo e duplicidade.
      requestBody:
        $ref: '#/components/requestBodies/Resultado'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /resultados-analise/amostras:
    get:
      tags: [Resultados]
      summary: Lista amostras elegíveis
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /resultados-analise/parametros:
    get:
      tags: [Resultados]
      summary: Lista parâmetros e limites aplicáveis
      parameters:
        - { in: query, name: matriz_id, schema: { type: integer } }
        - { in: query, name: legislacao_id, schema: { type: integer } }
        - { in: query, name: contexto_id, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /resultados-analise/matrizes:
    get:
      tags: [Resultados]
      summary: Lista matrizes
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /resultados-analise/legislacoes:
    get:
      tags: [Resultados]
      summary: Lista legislações aplicáveis
      parameters:
        - { in: query, name: matriz_id, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /resultados-analise/contextos:
    get:
      tags: [Resultados]
      summary: Lista contextos aplicáveis
      parameters:
        - { in: query, name: matriz_id, schema: { type: integer } }
        - { in: query, name: legislacao_id, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /resultados-analise/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Resultados]
      summary: Consulta resultado
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Resultados]
      summary: Corrige rascunho ou resultado rejeitado
      description: Incrementa versão e cria snapshot append-only.
      requestBody:
        $ref: '#/components/requestBodies/Resultado'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Resultados]
      summary: Arquiva resultado permitido
      description: Requer Gestor.
      requestBody:
        $ref: '#/components/requestBodies/ArchiveOptional'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /resultados-analise/{id}/submeter:
    post:
      tags: [Resultados]
      summary: Envia rascunho para revisão
      description: Método aplicável é obrigatório.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/Comment'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /resultados-analise/{id}/revisar:
    post:
      tags: [Resultados]
      summary: Aprova ou rejeita resultado
      description: Requer Gestor, senha, comentário e separação obrigatória entre submissor e revisor.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/Review'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /resultados-analise/{id}/aprovar:
    post:
      tags: [Resultados]
      summary: Atalho de aprovação
      description: Requer Gestor, senha, comentário e separação entre submissor e revisor.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/SignedRequiredComment'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /resultados-analise/{id}/rejeitar:
    post:
      tags: [Resultados]
      summary: Atalho de rejeição
      description: Requer Gestor, senha, comentário e separação entre submissor e revisor.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/SignedRequiredComment'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /resultados-analise/{id}/publicar:
    post:
      tags: [Resultados]
      summary: Publica e bloqueia resultado aprovado
      description: Requer Gestor e senha.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/SignedComment'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /resultados-analise/{id}/reabrir:
    post:
      tags: [Resultados]
      summary: Reabre aprovado/rejeitado como rascunho
      description: Requer Gestor, senha e comentário. Publicado não reabre.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/SignedRequiredComment'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /resultados-analise/{id}/historico-workflow:
    get:
      tags: [Resultados]
      summary: Consulta workflow append-only
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Page' }

  /laudos:
    get:
      tags: [Laudos]
      summary: Lista versões emitidas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
        - { in: query, name: amostra_id, schema: { type: integer } }
        - { in: query, name: cliente_id, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/Page' }

  /laudos/amostras/{amostraId}/versoes:
    post:
      tags: [Laudos]
      summary: Emite versão imutável
      description: |
        Requer Gestor e senha. A amostra deve estar concluída e ter o conjunto
        exato de resultados publicados. A identidade do laboratório vem de
        LAB_* no servidor. motivo é obrigatório a partir da versão 2;
        motivo_revisao é apenas alias de compatibilidade.
      parameters:
        - $ref: '#/components/parameters/SampleId'
      requestBody:
        $ref: '#/components/requestBodies/LaudoEmission'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /laudos/amostras/{amostraId}:
    get:
      tags: [Laudos]
      summary: Lista versões de uma amostra
      parameters:
        - $ref: '#/components/parameters/SampleId'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /laudos/{id}:
    get:
      tags: [Laudos]
      summary: Consulta snapshot e integridade
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }

  /laudos/{id}/html:
    get:
      tags: [Laudos]
      summary: Renderiza HTML imprimível com QR
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Documento privado e no-store.
          content:
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /inventario/resumo:
    get:
      tags: [Inventário]
      summary: Indicadores de estoque
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /inventario:
    get:
      tags: [Inventário]
      summary: Lista insumos e saldos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSizeCamel'
        - $ref: '#/components/parameters/Search'
        - { in: query, name: baixoEstoque, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/MetaPage' }
    post:
      tags: [Inventário]
      summary: Cadastra insumo
      description: Requer Analista ou Gestor.
      requestBody:
        $ref: '#/components/requestBodies/Insumo'
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /inventario/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Inventário]
      summary: Consulta insumo e lotes
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Inventário]
      summary: Atualiza dados do insumo
      description: Status usa endpoint específico.
      requestBody:
        $ref: '#/components/requestBodies/InsumoUpdate'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Inventário]
      summary: Arquiva insumo sem saldo
      description: Requer Gestor e motivo.
      requestBody:
        $ref: '#/components/requestBodies/ArchiveRequired'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inventario/{id}/status:
    post:
      tags: [Inventário]
      summary: Ativa ou inativa insumo
      description: Requer Gestor e motivo.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/ActiveDecision'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /inventario/{id}/lotes:
    post:
      tags: [Inventário]
      summary: Cadastra lote e entrada inicial
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/Lote'
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /inventario/lotes/{loteId}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    put:
      tags: [Inventário]
      summary: Atualiza metadados do lote
      requestBody:
        $ref: '#/components/requestBodies/LoteUpdate'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Inventário]
      summary: Arquiva lote sem saldo
      description: Requer Gestor e motivo.
      requestBody:
        $ref: '#/components/requestBodies/ArchiveRequired'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inventario/lotes/{loteId}/status:
    post:
      tags: [Inventário]
      summary: Decide status do lote
      description: Requer Gestor; lote vencido não pode ser liberado.
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        $ref: '#/components/requestBodies/LoteStatus'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inventario/lotes/{loteId}/movimentacoes:
    get:
      tags: [Inventário]
      summary: Consulta razão imutável
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSizeCamel'
      responses:
        '200': { $ref: '#/components/responses/MetaPage' }
    post:
      tags: [Inventário]
      summary: Registra entrada ou saída
      description: Saída valida lote, validade e saldo.
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        $ref: '#/components/requestBodies/StockMovement'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inventario/lotes/{loteId}/ajustes:
    post:
      tags: [Inventário]
      summary: Registra ajuste compensatório
      description: Requer Gestor; movimento existente é imutável.
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        $ref: '#/components/requestBodies/StockAdjustment'
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /equipamentos/resumo:
    get:
      tags: [Equipamentos]
      summary: Indicadores de disponibilidade
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /equipamentos:
    get:
      tags: [Equipamentos]
      summary: Lista equipamentos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSizeCamel'
        - $ref: '#/components/parameters/Search'
        - { in: query, name: somenteBloqueados, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/MetaPage' }
    post:
      tags: [Equipamentos]
      summary: Cadastra equipamento
      description: Requer Analista ou Gestor.
      requestBody:
        $ref: '#/components/requestBodies/Equipment'
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /equipamentos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Equipamentos]
      summary: Consulta equipamento
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Equipamentos]
      summary: Atualiza cadastro
      description: Status/calibração usam endpoints específicos.
      requestBody:
        $ref: '#/components/requestBodies/EquipmentUpdate'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Equipamentos]
      summary: Arquiva equipamento
      description: Requer Gestor, motivo e nenhuma intervenção ativa.
      requestBody:
        $ref: '#/components/requestBodies/ArchiveRequired'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /equipamentos/{id}/status:
    post:
      tags: [Equipamentos]
      summary: Decide estado operacional
      description: Requer Gestor; liberar exige calibração válida.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/EquipmentStatus'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /equipamentos/{id}/configuracao-calibracao:
    post:
      tags: [Equipamentos]
      summary: Configura calibração
      description: Requer Gestor e motivo.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/CalibrationConfig'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /equipamentos/{id}/eventos:
    get:
      tags: [Equipamentos]
      summary: Consulta calibrações/manutenções
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSizeCamel'
      responses:
        '200': { $ref: '#/components/responses/MetaPage' }
    post:
      tags: [Equipamentos]
      summary: Agenda ou inicia evento
      requestBody:
        $ref: '#/components/requestBodies/EquipmentEvent'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Conflict' }

  /equipamentos/{id}/eventos/{eventoId}/iniciar:
    post:
      tags: [Equipamentos]
      summary: Inicia evento agendado
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /equipamentos/{id}/eventos/{eventoId}/concluir:
    post:
      tags: [Equipamentos]
      summary: Conclui evento
      description: Requer Gestor; reprovação bloqueia o equipamento.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        $ref: '#/components/requestBodies/EquipmentEventCompletion'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /equipamentos/{id}/eventos/{eventoId}/cancelar:
    post:
      tags: [Equipamentos]
      summary: Cancela evento aberto
      description: Requer Gestor e motivo.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /equipamentos/{id}/utilizacoes:
    get:
      tags: [Equipamentos]
      summary: Consulta utilização imutável
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSizeCamel'
      responses:
        '200': { $ref: '#/components/responses/MetaPage' }
    post:
      tags: [Equipamentos]
      summary: Registra utilização
      description: Requer disponibilidade operacional.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/EquipmentUsage'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Conflict' }

  /qualidade/resumo:
    get:
      tags: [Qualidade]
      summary: Indicadores de QMS/CAPA
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /qualidade/responsaveis:
    get:
      tags: [Qualidade]
      summary: Lista responsáveis elegíveis
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /qualidade/ocorrencias:
    get:
      tags: [Qualidade]
      summary: Lista não conformidades e desvios
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSizeCamel'
        - $ref: '#/components/parameters/Search'
        - { in: query, name: status, schema: { $ref: '#/components/schemas/QmsStatus' } }
        - { in: query, name: tipo, schema: { $ref: '#/components/schemas/QmsType' } }
        - { in: query, name: vencidas, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/MetaPage' }
    post:
      tags: [Qualidade]
      summary: Abre ocorrência
      requestBody:
        $ref: '#/components/requestBodies/QmsOccurrence'
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /qualidade/ocorrencias/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Qualidade]
      summary: Consulta ocorrência e CAPA
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Qualidade]
      summary: Atualiza ocorrência aberta
      requestBody:
        $ref: '#/components/requestBodies/QmsOccurrenceUpdate'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Qualidade]
      summary: Arquiva ocorrência finalizada
      description: Requer Gestor e motivo.
      requestBody:
        $ref: '#/components/requestBodies/ArchiveRequired'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /qualidade/ocorrencias/{id}/decisoes:
    post:
      tags: [Qualidade]
      summary: Executa transição controlada
      description: Requer Gestor; causa raiz, CAPA e eficácia são validadas.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/QmsDecision'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /qualidade/ocorrencias/{id}/acoes:
    post:
      tags: [Qualidade]
      summary: Cadastra ação CAPA
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/Capa'
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /qualidade/ocorrencias/{id}/acoes/{acaoId}:
    patch:
      tags: [Qualidade]
      summary: Executa ação CAPA
      description: Conclusão exige evidência; ação finalizada é imutável.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        $ref: '#/components/requestBodies/CapaUpdate'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /qualidade/ocorrencias/{id}/acoes/{acaoId}/cancelar:
    post:
      tags: [Qualidade]
      summary: Cancela ação CAPA
      description: Requer Gestor e motivo.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /importacao/resultado-analise:
    post:
      tags: [Importação]
      summary: Importa CSV/XLSX como rascunho
      description: Requer Analista ou Gestor; máximo 10 MB e 5.000 linhas.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /importacao/template:
    get:
      tags: [Importação]
      summary: Baixa template
      parameters:
        - in: query
          name: formato
          schema: { type: string, enum: [csv, xlsx], default: csv }
      responses:
        '200':
          description: Arquivo CSV ou XLSX.
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /matrizes:
    get:
      tags: [Catálogos]
      summary: Lista matrizes
      responses:
        '200': { $ref: '#/components/responses/AnyJson' }

  /legislacoes:
    get:
      tags: [Catálogos]
      summary: Lista legislações
      responses:
        '200': { $ref: '#/components/responses/AnyJson' }

  /parametros:
    get:
      tags: [Catálogos]
      summary: Lista parâmetros legais
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /parametros/{id}:
    put:
      tags: [Catálogos]
      summary: Atualiza valor operacional permitido
      description: Requer Gestor.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [valor_parametro]
              properties:
                valor_parametro: { type: number, minimum: 0, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /gerenciamento-parametros:
    get:
      tags: [Catálogos]
      summary: Carrega parâmetros, matrizes e legislações para administração
      description: Requer Gestor; filtros são aplicados antes do COUNT e da página.
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - in: query
          name: q
          description: Busca sem diferenciar acentos; máximo de 100 caracteres.
          schema: { type: string, maxLength: 100 }
        - { in: query, name: matriz_id, schema: { type: integer, minimum: 1 } }
        - { in: query, name: legislacao_id, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de parâmetros e catálogos completos para os filtros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterManagementResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /gerenciamento-parametros/{id}:
    put:
      tags: [Catálogos]
      summary: Atualiza o valor operacional de um parâmetro
      description: Requer Gestor; qualquer outro campo é rejeitado.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [valor_parametro]
              properties:
                valor_parametro: { type: number, minimum: 0, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/AnyJson' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /dashboard-web:
    get:
      tags: [Monitoramento]
      summary: Dashboard web
      description: >-
        Considera somente resultados publicados. Filtros e status são aplicados
        antes da paginação; statistics representa todo o conjunto filtrado.
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - { in: query, name: matriz_id, schema: { type: integer } }
        - { in: query, name: legislacao_id, schema: { type: integer } }
        - { in: query, name: amostra_numero, schema: { type: string } }
        - { in: query, name: parametro_id, description: IDs separados por vírgula, schema: { type: string } }
        - { in: query, name: data_coleta, schema: { type: string, format: date } }
        - { in: query, name: data_publicacao, schema: { type: string, format: date } }
        - { in: query, name: status, description: Status separados por vírgula, schema: { type: string } }
      responses:
        '200':
          description: Página do dashboard e estatísticas globais dos filtros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /dashboard-web/filter-options:
    get:
      tags: [Monitoramento]
      summary: Filtros do dashboard
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /dashboardtv:
    get:
      tags: [Monitoramento]
      summary: Dashboard de TV
      description: >-
        Snapshot atual que considera somente o resultado publicado mais recente
        de cada parâmetro, com desempate por publicação, criação e ID.
      parameters:
        - { in: query, name: parametro_id, description: IDs separados por vírgula, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /grafico-parametros:
    get:
      tags: [Monitoramento]
      summary: Série de resultados publicados
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /alertas:
    get:
      tags: [Monitoramento]
      summary: Alertas de resultados publicados
      description: >-
        Requer Analista ou Gestor. A classificação usa alerta para valor ainda
        dentro do limite e próximo à borda, nao-conforme para extrapolação comum
        e critico para extrapolação superior à margem de 20%. Filtros e status
        são aplicados antes da paginação; stats representa o conjunto filtrado.
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: q
          description: Busca por parâmetro, matriz, contexto ou amostra.
          schema: { type: string, maxLength: 100 }
        - in: query
          name: search
          description: Alias legado de q; q tem precedência quando ambos são enviados.
          schema: { type: string, maxLength: 100 }
        - in: query
          name: status
          description: Slugs separados por vírgula.
          schema:
            type: string
            example: alerta,nao-conforme,critico
      responses:
        '200':
          description: Página de alertas e totais globais dos filtros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista usuários
      description: Requer Gestor.
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Usuários]
      summary: Cria usuário no Auth e cadastro local
      description: Requer Gestor; a conta administrativa é criada explicitamente aprovada.
      requestBody:
        $ref: '#/components/requestBodies/User'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /usuarios/{userId}/perfil:
    put:
      tags: [Usuários]
      summary: Altera perfil
      description: Requer Gestor.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [perfil]
              properties:
                perfil: { $ref: '#/components/schemas/Role' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }

  /usuarios/{userId}/aprovacao:
    put:
      tags: [Usuários]
      summary: Aprova ou bloqueia o acesso de um usuário
      description: >-
        Requer Gestor. Impede auto-bloqueio e bloqueio do último Gestor aprovado;
        a garantia também é aplicada atomicamente no banco.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [acesso_aprovado]
              properties:
                acesso_aprovado: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auditoria:
    get:
      tags: [Auditoria]
      summary: Consulta trilha imutável
      description: Requer Gestor.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: entity_type, schema: { type: string } }
        - { in: query, name: actor_user_id, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Page' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SampleId:
      in: path
      name: amostraId
      required: true
      schema: { type: integer, minimum: 1 }
    BatchId:
      in: path
      name: loteId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    EventId:
      in: path
      name: eventoId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ActionId:
      in: path
      name: acaoId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, format: uuid }
    ReportHash:
      in: path
      name: hash
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: page_size
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PageSizeCamel:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      in: query
      name: search
      schema: { type: string, maxLength: 100 }
    SearchQ:
      in: query
      name: q
      schema: { type: string, maxLength: 100 }

  responses:
    Success:
      description: Operação concluída.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessResponse' }
    Created:
      description: Registro criado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessResponse' }
    Page:
      description: Lista, opcionalmente paginada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedResponse' }
    MetaPage:
      description: Lista paginada dos módulos de qualidade.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MetaPaginatedResponse' }
    AnyJson:
      description: Resposta JSON legada sem envelope padronizado.
      content:
        application/json:
          schema: {}
    BadRequest:
      description: Payload, parâmetro ou identificador inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Token inválido ou confirmação de senha recusada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Perfil sem permissão.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Registro não encontrado ou arquivado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Regra de estado, concorrência ou domínio impede a operação.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Limite global ou de confirmação excedido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

