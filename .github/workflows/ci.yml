name: API quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm audit --omit=dev --audit-level=high
      - name: Syntax check
        shell: bash
        run: find controllers models routes middleware config utils -name '*.js' -print0 | xargs -0 -n1 node --check
