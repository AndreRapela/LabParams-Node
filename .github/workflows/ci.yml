name: API quality gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: api-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate database migrations
        run: node scripts/check-migrations.js
      - name: Validate Supabase security defaults
        run: node scripts/check-supabase-config.js
      - name: Protect applied migration history
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-history.js "${{ github.event.pull_request.base.sha }}"
      - name: Protect applied migration history on main
        if: github.event_name == 'push'
        run: node scripts/check-migration-history.js "${{ github.event.before }}"
      - run: npm test -- --runInBand
      - run: npm audit --omit=dev --audit-level=high
      - name: Syntax check
        shell: bash
        run: find controllers models routes middleware config utils scripts -name '*.js' -print0 | xargs -0 -n1 node --check
